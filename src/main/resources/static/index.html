<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<!-- Top Navigation Bar -->
<header class="topbar">
    <div class="logo">AI Video Generator</div>
    <nav class="navbar">
        <a href="#" class="nav-item active" id="profileLink">Profile</a>
        <a href="#" class="nav-item" id="projectsLink">Projects</a>
        <a href="#" class="nav-item" id="exploreLink">Explore</a>
        <a href="/AIVideoGeneratorBackend/static/templatemo_595_3d_coverflow/frontpage.html?_ijt=9d4cn5gusll6ukc8m40diovjv3&_ij_reload=RELOAD_ON_SAVE#home" class="nav-item" id="logOutLink">Log Out</a>
    </nav>
</header>

<!-- Main Content -->
<main class="main-container">
    <!-- Create Project Section -->
    <section class="create-project" id="create-project">
        <h2>Create New Project</h2>
        <form id="createProjectForm">
            <input type="text" id="projectName" placeholder="Project Name" required>
            <textarea id="projectDescription" placeholder="Project Description" rows="3" required></textarea>
            <button type="submit" id="createProjectBtn">Create Project</button>
        </form>
    </section>

    <!-- Existing Projects Section -->
    <section class="projects-section" id="projects-section">
        <h2>Press to open a project</h2>
        <div id="projectsList" class="projects-list">
            <!-- Existing projects will appear here -->
        </div>
    </section>
            <div id="projectDetails">

            </div>



    <div class="container">
        <h1>🎬 Veo 3 Video Generator</h1>
        <p class="subtitle">Generate AI videos from text prompts</p>

        <div class="input-group">
            <label for="promptInput">Enter Your Video Prompt</label>
            <textarea
                    id="promptInput"
                    placeholder="Describe the video you want to generate... (e.g., 'A cat playing piano in a jazz club')"
            ></textarea>
        </div>

        <div class="button-group">
            <button id="generateBtn" class="btn-primary">Generate Video</button>
            <button id="clearBtn" class="btn-secondary">Clear</button>
        </div>

        <div class="status-panel">
            <div class="status-title">Status</div>
            <div id="status" class="status-content">Ready to generate video</div>
            <div id="progressBar" class="progress-bar" style="display: none;">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <div id="videoInfo" style="display: none;"></div>
        </div>
    </div>




</main>

<script type="module" src="./javascript/dashboard.js"></script>
<script type="module" src="./javascript/main.js"></script>
<script type="module" src="./javascript/veo.js"></script>
<script type="module" src="./javascript/user.js"></script>
<script type="module" src="./javascript/admin.js"></script>
<script type="module" src="./javascript/veoScript.js"></script>




</body>
</html>
